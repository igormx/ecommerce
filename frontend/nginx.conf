server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: forward to PHP-FPM in the api container, stripping the /api prefix
    # so the Slim routes (e.g. "/") are matched as defined.
    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /$1$is_args$args;
    }

    # Fingerprinted assets: cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
